name: Flow review
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Sent by the Flow App. Do not edit.
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://plus.adonisjs.com/registry/
          scope: '@adonisplus'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADONISJS_PLUS_TOKEN }}
      - run: npx @adonisplus/flow install --ci
      - uses: adonisjs-plus/flow-review-action@v0.6.0
        with:
          payload: ${{ inputs.payload }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
