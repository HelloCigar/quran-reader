<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The Quran Reader mark (same shape as QuranMark in inertia/components/brand/logo.tsx).
    A favicon cannot read theme tokens, so the accent is copied from the palette:
    light = palette.emerald.light[45], dark = palette.emerald.dark[65]
    (src/themes/quran/tokens/quran.palette.ts).
  -->
  <style>
    path { fill: #076c4f; }
    @media (prefers-color-scheme: dark) { path { fill: #60b091; } }
  </style>
